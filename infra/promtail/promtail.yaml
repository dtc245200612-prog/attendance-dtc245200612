server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: attendance-docker
    file_sd_configs:
      - files:
          - /etc/promtail/targets.json
        refresh_interval: 10s
    pipeline_stages:
      - docker: {}
